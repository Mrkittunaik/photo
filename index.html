<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frames of Forever | Premium Indian Wedding Photography</title>
<meta name="description" content="Frames of Forever — a fine art Indian wedding photography studio. Step in to explore our portfolio, stories, and booking.">
<style>
  :root{
    --ink:#0f1410;
    --champagne:#f8f4ec;
    --gold:#c9a769;
    --gold-soft:#e4cd9a;
    --line:rgba(248,244,236,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:#c9b4a6;
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color:var(--champagne);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  img{display:block;}
  html,body{height:100%;overflow:hidden;}
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(5,1fr);
    height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    animation:fadeGrid 1.2s ease both;
  }
  @keyframes fadeGrid{from{opacity:0;}to{opacity:1;}}
  .grid figure{position:relative;overflow:hidden;margin:0;min-height:0;min-width:0;}
  .grid img{
    width:100%;height:100%;object-fit:cover;display:block;
    transform:scale(1.02);
    transition:transform 1.2s cubic-bezier(.16,1,.3,1);
  }
  .grid figure:hover img{transform:scale(1.08);}
  .center-cell{
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:clamp(14px,3.2vh,28px);
    background:#c9b4a6;
    padding:12px;min-height:0;min-width:0;
  }
  .mark{
    font-size:clamp(22px,6.2vw,40px);
    letter-spacing:0.06em;
    color:#5a3a30;
    font-weight:400;
    text-align:center;
  }
  .mark span{color:#5a3a30;}
  .tagline{display:none;}
  .step-in{
    font-family:inherit;
    letter-spacing:0.08em;
    font-size:clamp(10px,2.6vw,14px);
    color:#f3e9e0;
    background:#5a3a30;
    border:none;
    border-radius:999px;
    padding:clamp(9px,1.6vh,14px) clamp(20px,6vw,36px);
    cursor:pointer;
    transition:transform .3s ease, background .3s ease;
  }
  .step-in:hover{transform:translateY(-2px);background:#472b23;}
  .step-in:focus-visible{outline:2px solid #5a3a30;outline-offset:4px;}

  /* landscape / desktop: 5 x 3, center cell stays in the middle */
  @media (min-aspect-ratio:1/1){
    .grid{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);}
    .mark{font-size:clamp(22px,2.6vw,40px);}
    .step-in{font-size:clamp(10px,1vw,14px);padding:clamp(9px,1.6vh,14px) clamp(20px,2.4vw,36px);}
  }
  @media (prefers-reduced-motion:reduce){
    .grid,.grid img,.step-in{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<div class="grid" id="gate-grid">
  <figure><img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1767886097272-e441152edcdb?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1765881274684-b3c89dd44882?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?w=600&q=80&auto=format&fit=crop" alt=""></figure>

  <figure><img src="https://images.unsplash.com/photo-1765881395337-a69cf213bd84?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1783083350575-7650966a50c5?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <div class="center-cell">
    <div class="mark">FRAMES<span>.</span></div>
    <div class="tagline">A FINE ART INDIAN WEDDING STUDIO</div>
    <button class="step-in" onclick="window.location.href='home.html'">STEP IN</button>
  </div>
  <figure><img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&q=80&auto=format&fit=crop" alt=""></figure>

  <figure><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1590086782792-42dd2350140d?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=600&q=80&auto=format&fit=crop" alt=""></figure>
</div>

</body>
</html>
