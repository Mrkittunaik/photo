<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frames of Forever | Premium Indian Wedding Photography</title>
<meta name="description" content="Frames of Forever — a fine art Indian wedding photography studio. Step in to explore our portfolio, stories, and booking.">
<style>
  :root{
    --ink:#0f1410;
    --champagne:#f8f4ec;
    --gold:#c9a769;
    --gold-soft:#e4cd9a;
    --line:rgba(248,244,236,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color:var(--champagne);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  img{display:block;}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-rows:260px;
    animation:fadeGrid 1.4s ease both;
  }
  @keyframes fadeGrid{from{opacity:0;}to{opacity:1;}}
  .grid figure{
    position:relative;overflow:hidden;margin:0;
  }
  .grid figure::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,20,16,0.05), rgba(15,20,16,0.32));
  }
  .grid img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(92%) contrast(1.03);
    transform:scale(1.03);
    transition:transform 1.2s cubic-bezier(.16,1,.3,1);
  }
  .grid figure:hover img{transform:scale(1.1);}
  .center-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1d2a1e 0%, #0f1410 78%);
    flex-direction:column;
    gap:22px;
    padding:20px;
    position:relative;
  }
  .center-cell::before{
    content:'';position:absolute;inset:14px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .mark{
    font-size:clamp(26px,2.6vw,36px);
    letter-spacing:0.14em;
    color:var(--champagne);
    font-weight:400;
  }
  .mark span{color:var(--gold);}
  .tagline{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:0.22em;color:#9a8c78;}
  .step-in{
    font-family:'Helvetica Neue',Arial,sans-serif;
    letter-spacing:0.18em;
    font-size:12px;
    color:var(--ink);
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    border:none;
    border-radius:999px;
    padding:16px 38px;
    cursor:pointer;
    transition:transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s ease;
    box-shadow:0 8px 24px -8px rgba(201,167,105,0.5);
  }
  .step-in:hover{transform:translateY(-3px);box-shadow:0 14px 32px -10px rgba(201,167,105,0.65);}
  .step-in:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;}
    .center-cell{grid-column:span 3;grid-row:span 1;}
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:120px;}
    .center-cell{grid-column:span 2;padding:30px 16px;}
    .mark{font-size:24px;}
    .step-in{padding:14px 30px;font-size:11px;}
  }
  @media (max-width:360px){
    .grid{grid-auto-rows:105px;}
  }
  @media (prefers-reduced-motion:reduce){
    .grid,.grid img,.step-in{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<div class="grid" id="gate-grid">
  <figure><img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1610030182147-be331e79bd45?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1594736797933-d0f06ba36e39?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?w=600&q=80&auto=format&fit=crop" alt=""></figure>

  <figure><img src="https://images.unsplash.com/photo-1606216794074-735e91aa2c92?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1583391733956-6c78276477e2?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <div class="center-cell">
    <div class="mark">FRAMES<span>.</span></div>
    <div class="tagline">A FINE ART INDIAN WEDDING STUDIO</div>
    <button class="step-in" onclick="window.location.href='home.html'">STEP IN</button>
  </div>
  <figure><img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&q=80&auto=format&fit=crop" alt=""></figure>

  <figure><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1533211337-9075a9c1a3f4?w=600&q=80&auto=format&fit=crop" alt=""></figure>
  <figure><img src="https://images.unsplash.com/photo-1600096194534-95cf5ece04cf?w=600&q=80&auto=format&fit=crop" alt=""></figure>
</div>

</body>
</html>
